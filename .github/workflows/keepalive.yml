name: Supabase Keep-Alive

# Supabase pausiert Free-Projekte nach ~1 Woche Inaktivität (7.7). Dieser Cron
# stellt zweimal pro Woche eine kleine REST-Anfrage und hält das Projekt wach.
on:
  schedule:
    - cron: "17 6 * * 1,4" # Montag & Donnerstag, 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/app_state?select=doc_key&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}")
          echo "HTTP $code"
          # 200 (RLS liefert leer) gilt als erfolgreicher Lebenszeichen-Ping.
          test "$code" = "200"
